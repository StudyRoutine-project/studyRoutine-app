project_id = "studyroutine"

[api]
enabled = true
port = 54321
schemas = ["public"]
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "studyroutine://auth/confirmar"
additional_redirect_urls = ["studyroutine://auth/confirmar", "studyroutine://auth/nova-senha"]
minimum_password_length = 8
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1s"

[local_smtp]
enabled = true
port = 54324

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental.pgdelta]
enabled = true
